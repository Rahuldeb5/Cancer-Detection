# binary tumor segmentation: 1 output channel (sigmoid), not one class per organ
classes: 1
aux_loss: true
aux_weight: [1.0, 0.4]

cache_dir: ~/research/datasets/pants/cache
k_fold: 5

spatial_size: [128, 128, 128]
pos: 2
neg: 1
num_samples: 4

# tuned via a pos_weight sweep (5/10/15/20/25/60) on 2026-08-23 -- 60 (the original
# starting-point guess) collapsed the model to predicting positive everywhere
# (specificity ~0.02); 20 was the best balance of specificity gains without sacrificing
# sensitivity the way pos_weight=5 did. Re-tune if the crop config changes materially.
pos_weight: 20.0

epochs: 200
base_lr: 0.0006
weight_decay: 0.05
warmup_epoch: 5

# caps gradient norm before each optimizer step -- fp16/AMP training can otherwise diverge
# silently (a NaN loss recurring for many iterations means the model has already collapsed,
# not just hit a one-off overflow); see train_epoch's NAN_STREAK_LIMIT for the loud failure
# mode this is meant to prevent from being needed in the first place
grad_clip_norm: 1.0

num_workers: 4
aug_device: cpu

ema: false
ema_alpha: 0.99

iter_per_epoch: 250
print_freq: 20
val_freq: 5
sw_batch_size: 4
sw_overlap: 0.5

# NSD "how close counts as matched" tolerance in mm -- no official value for pancreatic
# tumors, 2mm is a reasonable starting point at this dataset's ~1x1x1.5mm spacing
nsd_tolerance_mm: 2.0

reproduce_seed: null
